[build-system]
requires = ["setuptools==75.3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cobot-dagger"
version = "0.2.0"
description = "Cobot recording, HIL labels, mask and segmented capture domain"
requires-python = ">=3.8,<3.9"
dependencies = ["h5py==3.11.0", "numpy==1.24.4", "PyYAML==6.0.3", "pillow==10.4.0", "opencv-python-headless==4.10.0.84"]

[tool.setuptools.packages.find]
where = ["src"]
[dependency-groups]
dev = ["pytest==8.3.5"]
